name: Rebuild repo index

on:
  push:
    branches: [main]
    # 只在这些输入变化时触发 —— 绝不含 Packages / Release，
    # 否则机器人提交索引会再触发自己，形成死循环
    paths:
      - 'debs/**'
      - 'repo.json'
      - 'tools/gen_repo.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate index
        run: python tools/gen_repo.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release packages.json repo-data.js
          if git diff --staged --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: rebuild repo index"
            git push
          fi
