<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vxs · 越狱软件源</title>
<link rel="icon" href="CydiaIcon.png">
<style>
  :root {
    --accent: #5B6CFF;
    --bg: #0f1117;
    --surface: #181b24;
    --surface2: #21252f;
    --text: #eef1f7;
    --muted: #9aa3b2;
    --border: #2b3040;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  header {
    padding: 64px 0 40px;
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(91,108,255,.28), transparent 62%);
  }
  .icon {
    width: 96px; height: 96px;
    border-radius: 24px;
    margin: 0 auto 20px;
    display: block;
    background: linear-gradient(145deg, var(--accent), #8b7bff);
    box-shadow: 0 12px 36px rgba(91,108,255,.4);
    object-fit: cover;
  }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .sub { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .url {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    display: inline-block;
    padding: 7px 16px;
    margin-top: 18px;
    word-break: break-all;
  }

  .actions { display: flex; flex-direction: column; gap: 12px; margin: 32px 0 44px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px;
    border-radius: var(--radius);
    font-size: 16px; font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: var(--surface); color: var(--text); border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--surface2); }

  .warn {
    display: none;
    background: rgba(255,176,32,.1);
    border: 1px solid rgba(255,176,32,.4);
    color: #ffc95c;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .warn.show { display: block; }

  .sec-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--muted);
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }

  /* ---- 源状态统计条 ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 32px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
  }
  .stat-num {
    font-size: 20px; font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-label {
    font-size: 11.5px; color: var(--muted);
    margin-top: 3px;
    letter-spacing: .2px;
  }
  .stat-num.ok { color: #4ade80; }

  .steps {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px 20px 42px;
    margin-bottom: 40px;
  }
  .steps li { margin-bottom: 10px; font-size: 14.5px; color: #cfd6e2; }
  .steps li:last-child { margin-bottom: 0; }
  .steps code {
    background: var(--surface2); padding: 2px 7px; border-radius: 6px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #a8b6ff;
  }

  .pkg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .pkg-avatar {
    width: 46px; height: 46px; flex: 0 0 46px;
    border-radius: 12px;
    background: linear-gradient(145deg, #2b3040, #3a4155);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; color: #8b95ab;
  }
  .pkg-body { min-width: 0; flex: 1; }
  .pkg-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pkg-name { font-size: 16px; font-weight: 600; }
  .pkg-ver {
    font-size: 12px; color: #a8b6ff;
    background: rgba(91,108,255,.14);
    padding: 2px 8px; border-radius: 999px;
    font-family: ui-monospace, monospace;
  }
  .pkg-desc { font-size: 13.5px; color: var(--muted); margin-top: 5px; }
  .pkg-meta { font-size: 12px; color: #6f7a8d; margin-top: 7px; }

  .empty {
    text-align: center; padding: 48px 24px; color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.75;
  }
  .empty-icon {
    width: 52px; height: 52px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 10px; font-weight: 600; }
  .empty code {
    background: var(--surface2); padding: 2px 7px; border-radius: 6px;
    font-size: 12.5px; font-family: ui-monospace, monospace; color: #a8b6ff;
  }

  .sec-title { margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="icon" src="CydiaIcon.png" alt="vxs" onerror="this.style.display='none'">
    <h1 id="repoName">vxs</h1>
    <p class="sub" id="repoDesc">越狱软件源</p>
    <div class="url" id="repoUrl">https://fatekingcsr.github.io/</div>
  </div>
</header>

<div class="wrap">

  <div class="warn" id="urlWarn">
    源地址仍是占位符，请先修改 <code>repo.json</code> 里的 <code>url</code> 再重新生成。
  </div>

  <div class="actions">
    <a class="btn btn-primary" id="addBtn" href="#">添加到 Sileo</a>
    <a class="btn btn-ghost" id="copyBtn" href="#">复制源地址</a>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="statPkgs">0</div>
      <div class="stat-label">软件包</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statArch">2</div>
      <div class="stat-label">支持架构</div>
    </div>
    <div class="stat">
      <div class="stat-num ok">在线</div>
      <div class="stat-label">源状态</div>
    </div>
  </div>

  <div class="sec-title">如何在设备上添加</div>
  <ol class="steps">
    <li>打开 <strong>Sileo</strong>，切到底部 <strong>软件源</strong> 标签。</li>
    <li>点右上角 <code>+</code>，粘贴源地址后确认。</li>
    <li>返回源列表下拉刷新，即可看到本源的包。</li>
    <li>其他客户端（Zebra / Cydia / Installer）地址相同，也支持 <code>sileo://source/</code> 一键跳转。</li>
  </ol>

  <div class="sec-title">软件包 <span id="pkgCount"></span></div>
  <div id="pkgList"></div>
</div>

<script src="repo-data.js"></script>
<script>
(function () {
  var data = window.SILEO_REPO || { name: "vxs", description: "越狱软件源", url: "", packages: [] };
  var url = data.url || location.href.split("/").slice(0, -1).join("/") + "/";
  if (url.indexOf("github.io") !== -1 && !/\/$/.test(url)) url += "/";

  var el = function (id) { return document.getElementById(id); };

  el("repoName").textContent = data.name || "vxs";
  el("repoDesc").textContent = data.tagline || data.description || "";
  el("repoUrl").textContent = url;

  if (data.accent) {
    document.documentElement.style.setProperty("--accent", data.accent);
  }

  // placeholder / invalid URL guard
  // 合法形态有两种：
  //   项目站  https://<user>.github.io/<repo>/
  //   主页站  https://<user>.github.io/       （只有一个路径段）
  // 只有明确是占位符（含 your-name / example / 尖括号）或压根不是 https 时才告警。
  var isHttps = /^https:\/\/[^/]+\//.test(url);
  var isPlaceholder = /your-?name|example|<|>|\{\{/.test(url);
  var bad = !isHttps || isPlaceholder;
  if (bad) {
    el("urlWarn").classList.add("show");
  }

  el("addBtn").addEventListener("click", function (e) {
    e.preventDefault();
    location.href = "sileo://source/" + encodeURIComponent(url);
  });

  el("copyBtn").addEventListener("click", function (e) {
    e.preventDefault();
    var self = this;
    var done = function () {
      self.textContent = "已复制 ✓";
      setTimeout(function () { self.textContent = "复制源地址"; }, 1600);
    };
    if (navigator.clipboard && location.protocol === "https:") {
      navigator.clipboard.writeText(url).then(done, function () { fallback(); });
    } else { fallback(); }

    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (err) { /* ignore */ }
      document.body.removeChild(ta);
    }
  });

  var list = el("pkgList");
  var pkgs = data.packages || [];

  // --- 统计条 ---
  el("statPkgs").textContent = pkgs.length;
  el("pkgCount").textContent = pkgs.length ? "· " + pkgs.length + " 个" : "";
  var archs = {};
  pkgs.forEach(function (p) { if (p.architecture) archs[p.architecture] = 1; });
  el("statArch").textContent = Object.keys(archs).length || 2;

  if (!pkgs.length) {
    list.innerHTML =
      '<div class="empty">' +
      '<div class="empty-icon">📦</div>' +
      "<strong>源里还没有软件包</strong>" +
      "把 .deb 放进 <code>debs/</code> 目录，<br>" +
      "然后运行 <code>python tools/gen_repo.py</code> 生成索引。" +
      "</div>";
    return;
  }

  var frag = document.createDocumentFragment();
  pkgs.forEach(function (p) {
    var card = document.createElement("div");
    card.className = "pkg";

    var avatar = document.createElement("div");
    avatar.className = "pkg-avatar";
    avatar.textContent = (p.name || p.package || "?").charAt(0).toUpperCase();

    var body = document.createElement("div");
    body.className = "pkg-body";

    var top = document.createElement("div");
    top.className = "pkg-top";
    var nm = document.createElement("span");
    nm.className = "pkg-name";
    nm.textContent = p.name || p.package;
    top.appendChild(nm);
    if (p.version) {
      var ver = document.createElement("span");
      ver.className = "pkg-ver";
      ver.textContent = p.version;
      top.appendChild(ver);
    }
    body.appendChild(top);

    if (p.description) {
      var desc = document.createElement("div");
      desc.className = "pkg-desc";
      desc.textContent = p.description;
      body.appendChild(desc);
    }

    var meta = [];
    if (p.author) meta.push(p.author);
    if (p.size) meta.push((p.size / 1024).toFixed(1) + " KB");
    if (p.section) meta.push(p.section);
    if (meta.length) {
      var md = document.createElement("div");
      md.className = "pkg-meta";
      md.textContent = meta.join(" · ");
      body.appendChild(md);
    }

    card.appendChild(avatar);
    card.appendChild(body);
    frag.appendChild(card);
  });
  list.appendChild(frag);
})();
</script>
</body>
</html>
